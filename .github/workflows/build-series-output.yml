name: build-series-output

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "series/*.json"
      - "scripts/build_series_output.py"
      - "build_series_index.py"
      - ".github/workflows/build-series-output.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build output
        env:
          OUTPUT_MODE: legacy
        run: |
          python scripts/build_series_output.py
          python build_series_index.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for p in Path("output_series").glob("*.json"):
              with p.open("r", encoding="utf-8") as f:
                  json.load(f)
              print("OK:", p)
          PY
